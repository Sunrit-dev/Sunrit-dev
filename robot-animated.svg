<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img" aria-label="Animated robot saying Hi, I am Sunrit Biswas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23314f"/>
      <stop offset="1" stop-color="#18233c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <style>
      .txt{font-family:'Segoe UI',Arial,sans-serif;fill:#e6edf7}
      .sub{font-family:'Segoe UI',Arial,sans-serif;fill:#7dd3fc}
    </style>
  </defs>

  <rect width="440" height="260" rx="22" fill="url(#bg)"/>
  <g stroke="#1d2942" stroke-width="1">
    <line x1="0" y1="40" x2="440" y2="40"/>
    <line x1="0" y1="80" x2="440" y2="80"/>
    <line x1="0" y1="120" x2="440" y2="120"/>
    <line x1="0" y1="160" x2="440" y2="160"/>
    <line x1="0" y1="200" x2="440" y2="200"/>
    <line x1="40" y1="0" x2="40" y2="260"/>
    <line x1="80" y1="0" x2="80" y2="260"/>
    <line x1="120" y1="0" x2="120" y2="260"/>
    <line x1="160" y1="0" x2="160" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="240" y1="0" x2="240" y2="260"/>
    <line x1="280" y1="0" x2="280" y2="260"/>
    <line x1="320" y1="0" x2="320" y2="260"/>
    <line x1="360" y1="0" x2="360" y2="260"/>
    <line x1="400" y1="0" x2="400" y2="260"/>
  </g>

  <g>
    <ellipse cx="220" cy="218" rx="86" ry="12" fill="#000" opacity="0.35">
      <animate attributeName="rx" values="86;78;86" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.25;0.35" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="4s" repeatCount="indefinite"/>

    <rect x="196" y="22" width="48" height="10" rx="5" fill="#38bdf8"/>
    <circle cx="220" cy="16" r="7" fill="#f43f5e">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <g>
      <path d="M200 46 L200 34" stroke="#23314f" stroke-width="6" stroke-linecap="round"/>
      <path d="M240 46 L240 34" stroke="#23314f" stroke-width="6" stroke-linecap="round"/>
    </g>

    <rect x="128" y="48" width="184" height="128" rx="26" fill="url(#head)" stroke="#38bdf8" stroke-width="3"/>
    <rect x="118" y="180" width="204" height="26" rx="13" fill="url(#head)" stroke="#38bdf8" stroke-width="3"/>

    <circle cx="172" cy="104" r="20" fill="#0ea5e9">
      <animate attributeName="ry" values="20;20;2;20" dur="3.4s" repeatCount="indefinite" keyTimes="0;0.9;0.95;1"/>
      <animate attributeName="cy" values="104;104;122;104" dur="3.4s" repeatCount="indefinite" keyTimes="0;0.9;0.95;1"/>
    </circle>
    <circle cx="268" cy="104" r="20" fill="#0ea5e9">
      <animate attributeName="ry" values="20;20;2;20" dur="3.4s" repeatCount="indefinite" keyTimes="0;0.9;0.95;1"/>
      <animate attributeName="cy" values="104;104;122;104" dur="3.4s" repeatCount="indefinite" keyTimes="0;0.9;0.95;1"/>
    </circle>
    <circle cx="175" cy="107" r="7" fill="#e2f3ff"/>
    <circle cx="271" cy="107" r="7" fill="#e2f3ff"/>

    <path d="M196 152 Q220 170 244 152" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 112 194; 20 112 194; 0 112 194" dur="2.4s" repeatCount="indefinite"/>
      <rect x="92" y="188" width="22" height="46" rx="10" fill="url(#body)"/>
      <circle cx="103" cy="240" r="9" fill="#38bdf8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 328 194; -20 328 194; 0 328 194" dur="2.4s" repeatCount="indefinite"/>
      <rect x="326" y="188" width="22" height="46" rx="10" fill="url(#body)"/>
      <circle cx="337" cy="240" r="9" fill="#38bdf8"/>
    </g>

    <rect x="180" y="160" width="80" height="16" rx="4" fill="#0b1220"/>
    <path d="M192 168 L196 164 L200 168 Z" fill="#38bdf8"/>
    <path d="M260 168 L256 164 L252 168 Z" fill="#38bdf8"/>
  </g>

  <text x="220" y="218" text-anchor="middle" class="txt" font-size="27" font-weight="700">
    Hi, I am Sunrit Biswas
    <animate attributeName="opacity" values="0;0;1" dur="1.2s" repeatCount="1" fill="freeze"/>
  </text>
  <text x="220" y="244" text-anchor="middle" class="sub" font-size="15" letter-spacing="2">
    SYSTEMS &amp; AI BUILDER
    <animate attributeName="opacity" values="0;0;1" dur="1.8s" repeatCount="1" fill="freeze"/>
  </text>
</svg>